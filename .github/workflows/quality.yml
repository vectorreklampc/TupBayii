name: Kalite Kapilari

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Backend build, format, unit ve mimari
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Paketleri güvenlik denetimiyle yükle
        run: dotnet restore TupBayiProje.slnx -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:TreatWarningsAsErrors=true
      - name: Format ve statik analiz
        run: dotnet format TupBayiProje.slnx --verify-no-changes --no-restore
      - name: Derle
        run: dotnet build TupBayiProje.slnx --no-restore --configuration Release
      - name: Birim ve mimari testler
        run: dotnet test TupBayiProje.slnx --no-build --configuration Release

  contracts:
    name: OpenAPI contract ve güvenlik
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Contract validation
        run: npm run validate
      - name: Pozitif ve negatif contract testleri
        run: npm test
      - name: PR base contract'ini gecici dosyaya cikar
        if: github.event_name == 'pull_request'
        id: baseline
        shell: bash
        run: |
          if git cat-file -e "${{ github.event.pull_request.base.sha }}:contracts/openapi.json"; then
            git show "${{ github.event.pull_request.base.sha }}:contracts/openapi.json" > "$RUNNER_TEMP/openapi-base.json"
            echo "mevcut=true" >> "$GITHUB_OUTPUT"
          else
            echo "mevcut=false" >> "$GITHUB_OUTPUT"
            echo "Base SHA'da onceki kanonik OpenAPI yok; bu ilk contract yayinidir."
          fi
      - name: Breaking OpenAPI degisikligini belirle
        if: github.event_name == 'pull_request' && steps.baseline.outputs.mevcut == 'true'
        id: compatibility
        run: node scripts/kirici-degisiklik-kontrol.mjs "$RUNNER_TEMP/openapi-base.json" openapi.json
      - name: Pull request review'larini al
        if: github.event_name == 'pull_request' && steps.compatibility.outputs.kirici == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" --slurp > "$RUNNER_TEMP/review-pages.json"
      - name: Breaking degisiklik onayini dogrula
        if: github.event_name == 'pull_request' && steps.compatibility.outputs.kirici == 'true'
        shell: bash
        run: jq 'add' "$RUNNER_TEMP/review-pages.json" > "$RUNNER_TEMP/reviews.json" && node scripts/kirici-degisiklik-onay.mjs "$RUNNER_TEMP/reviews.json"
      - name: Bağımlılık güvenliği
        run: npm audit --audit-level=high

  event-contracts:
    name: Olay sözleşmesi registry ve uyumluluk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: event-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: event-contracts/package-lock.json
      - run: npm ci
      - name: Registry ve örnek payload doğrulaması
        run: npm run validate
      - name: Pozitif, negatif ve revision testleri
        run: npm test
      - name: Base branch ile revision uyumluluğu
        if: github.event_name == 'pull_request'
        shell: bash
        working-directory: .
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if git cat-file -e "$BASE_SHA:event-contracts/registry.json"; then
            mkdir -p "$RUNNER_TEMP/event-contracts-base"
            git archive "$BASE_SHA" -- event-contracts | tar -x -C "$RUNNER_TEMP/event-contracts-base"
            node event-contracts/scripts/uyumluluk-kontrolu.mjs "$RUNNER_TEMP/event-contracts-base/event-contracts" event-contracts
          fi
      - name: Bağımlılık güvenliği
        run: npm audit --audit-level=high

  admin-web:
    name: Admin Web lint, test, build ve güvenlik
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - name: Admin Web API istemcisini kanonik OpenAPI'den tekrar uret
        run: node ../contracts/scripts/admin-web-client-uret.mjs
      - name: Uretilen Admin Web API istemcisinin deterministik oldugunu dogrula
        run: git diff --exit-code -- src/api/uretilen
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # GHSA-vfj7-8cjw-p6xm icin upstream yama yoktur. Etkilenen braces,
      # yalniz repo-kontrollu glob kullanan lint/shadcn gelistirme araclarindadir.
      # Uretim agaci bloklanir; gecici dev kapsami 2026-11-07'ye kadar yeniden incelenir.
      - name: Uretim bagimliliklarini guvenlik denetiminden gecir
        run: npm audit --omit=dev --audit-level=high

  flutter:
    name: Flutter analiz, test ve build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Kanonik mock server bagimliliklarini yukle
        run: npm ci
        working-directory: contracts
      - run: flutter pub get --enforce-lockfile
      - name: Flutter API istemcisini kanonik OpenAPI'den tekrar uret
        run: node ../contracts/scripts/flutter-client-uret.mjs
      - name: Uretilen Flutter API istemcisinin deterministik oldugunu dogrula
        working-directory: .
        run: git diff --exit-code -- flutter/packages/tup_api flutter/pubspec.lock
      - run: dart format --output=none --set-exit-if-changed apps packages
      - run: flutter analyze
      - run: flutter test packages/tup_api
      - run: flutter test apps/tup_mobile
      - run: flutter test apps/tup_desktop
      - name: Android debug build
        run: flutter build apk --debug
        working-directory: flutter/apps/tup_mobile
