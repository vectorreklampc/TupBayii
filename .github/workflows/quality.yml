name: Kalite Kapilari

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  backend:
    name: Backend build, format, unit ve mimari
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Paketleri güvenlik denetimiyle yükle
        run: dotnet restore TupBayiProje.slnx -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:TreatWarningsAsErrors=true
      - name: Format ve statik analiz
        run: dotnet format TupBayiProje.slnx --verify-no-changes --no-restore
      - name: Derle
        run: dotnet build TupBayiProje.slnx --no-restore --configuration Release
      - name: Birim ve mimari testler
        run: dotnet test TupBayiProje.slnx --no-build --configuration Release

  contracts:
    name: OpenAPI contract ve güvenlik
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci
      - name: Contract validation
        run: npm run validate
      - name: Pozitif ve negatif contract testleri
        run: npm test
      - name: PR base contract'ini gecici dosyaya cikar
        if: github.event_name == 'pull_request'
        shell: bash
        run: git show "${{ github.event.pull_request.base.sha }}:contracts/openapi.json" > "$RUNNER_TEMP/openapi-base.json"
      - name: Breaking OpenAPI degisikligini belirle
        if: github.event_name == 'pull_request'
        id: compatibility
        run: node scripts/kirici-degisiklik-kontrol.mjs "$RUNNER_TEMP/openapi-base.json" openapi.json
      - name: Pull request review'larini al
        if: github.event_name == 'pull_request' && steps.compatibility.outputs.kirici == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" --slurp > "$RUNNER_TEMP/review-pages.json"
      - name: Breaking degisiklik onayini dogrula
        if: github.event_name == 'pull_request' && steps.compatibility.outputs.kirici == 'true'
        shell: bash
        run: jq 'add' "$RUNNER_TEMP/review-pages.json" > "$RUNNER_TEMP/reviews.json" && node scripts/kirici-degisiklik-onay.mjs "$RUNNER_TEMP/reviews.json"
      - name: Bağımlılık güvenliği
        run: npm audit --audit-level=high

  admin-web:
    name: Admin Web lint, test, build ve güvenlik
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  flutter:
    name: Flutter analiz, test ve build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed apps packages
      - run: flutter analyze
      - run: flutter test apps/tup_mobile
      - run: flutter test apps/tup_desktop
      - name: Android debug build
        run: flutter build apk --debug
        working-directory: flutter/apps/tup_mobile
